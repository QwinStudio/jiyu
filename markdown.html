<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://fonts.cdnfonts.com/css/harmonyos-sans"><title>Markdown Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#eff8f9;color:#17333a;font-family:"HarmonyOS Sans",Harmony,sans-serif}.bar{height:72px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #dcebed}.bar a{text-decoration:none;color:inherit}.bar b{letter-spacing:.06em}.studio{display:grid;grid-template-columns:1fr 1fr;min-height:calc(100vh - 72px)}textarea,.preview{width:100%;min-height:0;padding:28px;border:0;font:15px/1.8 ui-monospace,Consolas,monospace;outline:0}.preview{background:#fff;border-left:1px solid #dcebed;font-family:"HarmonyOS Sans",Harmony,sans-serif}.preview h1{font-size:32px}.preview h2{font-size:24px}.preview code{background:#eaf3f4;padding:2px 5px;border-radius:5px}@media(max-width:700px){.studio{grid-template-columns:1fr;grid-template-rows:50vh 50vh}.preview{border-left:0;border-top:1px solid #dcebed}}</style></head><body><header class="bar"><a href="manage.html">← 内容管理</a><b>MARKDOWN STUDIO</b><button id="copy">复制 Markdown</button></header><main class="studio"><textarea id="editor" placeholder="# 标题\n\n在这里写 Markdown…"></textarea><article id="preview" class="preview"><h1>Markdown 预览</h1></article></main><script>const e=document.querySelector('#editor'),p=document.querySelector('#preview');function esc(s){return s.replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))}function draw(){p.innerHTML=esc(e.value||'# Markdown 预览').split('\n').map(x=>x.startsWith('### ')?'<h3>'+x.slice(4)+'</h3>':x.startsWith('## ')?'<h2>'+x.slice(3)+'</h2>':x.startsWith('# ')?'<h1>'+x.slice(2)+'</h1>':x.startsWith('- ')?'<li>'+x.slice(2)+'</li>':x?'<p>'+x.replace(/`([^`]+)`/g,'<code>$1</code>')+'</p>':'').join('')}e.oninput=draw;document.querySelector('#copy').onclick=()=>navigator.clipboard.writeText(e.value);draw()</script></body></html>
