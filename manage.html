<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JIYUGebit · 内容管理</title><link rel="stylesheet" href="manage.css"><link rel="stylesheet" href="manage-external.css"></head>
<body>
  <main class="admin">
    <header><a class="brand" href="index.html">JIYU<span>GEBIT</span></a><div><small>LOCAL CONTENT STUDIO</small><h1>内容管理</h1></div><button id="theme" aria-label="切换外观">◐</button></header>
    <section class="stats" id="stats"></section>
    <section class="grid">
      <article><p class="eyebrow">VIDEO</p><h2>新增视频</h2><form id="video-form"><input name="number" inputmode="numeric" placeholder="封面编号，例如 21" required><input name="title" placeholder="视频标题" required><input name="date" placeholder="创作时间，例如 2026.07.26"><textarea name="description" placeholder="视频注释"></textarea><input name="bilibili" placeholder="Bilibili 链接"><input name="douyin" placeholder="抖音链接"><input name="xiaohongshu" placeholder="小红书链接"><button>保存视频</button></form></article>
      <article><p class="eyebrow">NOTE</p><h2>新增笔记</h2><form id="note-form"><input name="title" placeholder="笔记标题" required><textarea name="body" placeholder="正文内容（自动生成 Markdown 笔记）" class="large"></textarea><button>保存笔记</button></form><a class="hint" href="markdown.html">打开独立 Markdown 编辑器</a></article>
      <article><p class="eyebrow">SITE</p><h2>维护工具</h2><form id="version-form"><input name="version" placeholder="网站版本号，例如 2.173" required><button>更新版本号</button></form><div class="tools"><button data-action="syncAlbums">同步影集与缩略图</button><button data-action="syncMusic">&#19968;&#38190;&#21516;&#27493;&#38899;&#20048;&#19987;&#36753;</button><button data-action="buildIndex">更新搜索索引</button></div><p class="hint">所有操作都会直接写入本地数据文件；删除笔记会同时删除对应 Markdown 文件。</p></article>
    </section>
    <section id="content-library" class="library"><div class="library-head"><div><p class="eyebrow">CONTENT LIBRARY</p><h2>已有内容</h2></div><button id="batch-delete" class="danger">删除已选</button></div><div class="filters"><button data-filter="all">全部</button><button data-filter="video">视频</button><button data-filter="note">笔记</button><button data-filter="album">影集</button></div><div id="library-rows"></div></section>
    <section id="music-library" class="library"><div class="library-head"><div><p class="eyebrow">MUSIC LIBRARY</p><h2>&#38899;&#20048;&#19987;&#36753;&#19982;&#27468;&#26354;</h2></div><button data-action="syncMusic">&#21516;&#27493;&#19987;&#36753;</button><button data-action="syncLyrics">&#33258;&#21160;&#21516;&#27493;&#27468;&#35789;</button></div><div id="music-album-rows"></div></section>
    <section class="library" id="external-music-library"><div class="library-head"><div><p class="eyebrow">EXTERNAL MUSIC</p><h2>外链音乐</h2></div><button id="open-external-music">添加外链</button></div><p class="hint">外链卡片只跳转至你填写的官方平台页面，不会代理或播放第三方音频。</p><div id="external-music-rows"></div></section>
    <dialog id="external-music-dialog" class="external-music-dialog"><form id="external-music-form" method="dialog"><div class="external-music-dialog-head"><div><p class="eyebrow">EXTERNAL MUSIC CARD</p><h2>填写外链音乐</h2></div><button type="button" class="external-dialog-close" aria-label="关闭">×</button></div><input type="hidden" name="id"><label>平台<select name="platform"><option>网易云音乐</option><option>QQ 音乐</option><option>酷狗音乐</option><option>Spotify</option><option>Apple Music</option><option>其他平台</option></select></label><label>歌曲或专辑标题<input name="title" required placeholder="例如：特别的人"></label><label>艺人<input name="artist" placeholder="例如：方大同"></label><label>官方跳转链接<input name="url" type="url" required placeholder="https://..."></label><label>封面链接（可选）<input name="cover" type="url" placeholder="https://.../cover.jpg"></label><label>强调色（可选）<input name="accent" value="#4fc3f7" pattern="^#[0-9A-Fa-f]{6}$" placeholder="#4fc3f7"></label><label>说明（可选）<textarea name="description" placeholder="外链卡片的小字说明"></textarea></label><div class="external-dialog-actions"><button type="button" class="external-dialog-close">取消</button><button type="submit">保存外链</button></div></form></dialog>
    <p class="status" id="status">正在连接本地内容服务…</p>
  </main>
  <script src="manage.js?v=20260727-music1"></script><script src="manage-music.js?v=20260727-music2"></script><script src="manage-external-music.js?v=20260727-external1"></script>
</body>
</html>
