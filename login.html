<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="https://fonts.cdnfonts.com/css/harmonyos-sans"><title>JIYUGebit · 内容管理登录</title><style>@font-face{font-family:LemonMilk;src:url('fonts/LEMONMILK-Regular.woff2') format('woff2');font-display:swap}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 18% 15%,#bfeff2,transparent 32%),linear-gradient(135deg,#e5f8f8,#fff 55%,#e1f4f8);font-family:"HarmonyOS Sans",Harmony,sans-serif;color:#19343a}.box{width:min(390px,calc(100% - 40px));padding:38px;border:1px solid rgba(255,255,255,.8);border-radius:28px;background:rgba(255,255,255,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.95),0 20px 58px rgba(45,112,125,.16);backdrop-filter:blur(24px)}.brand{font:700 27px LemonMilk,sans-serif;letter-spacing:-.08em}.brand span{color:#41606b;font-weight:400;margin-left:.08em}small{display:block;margin-top:30px;color:#6d858b;font:10px LemonMilk,sans-serif;letter-spacing:.14em}h1{font-size:27px;margin:8px 0 24px}input,button{width:100%;padding:13px 14px;border-radius:14px;font:14px "HarmonyOS Sans",Harmony,sans-serif}input{margin-bottom:11px;border:1px solid rgba(48,100,111,.16);background:rgba(255,255,255,.72);outline:0}input:focus{border-color:#00BCD4;box-shadow:0 0 0 3px rgba(0,188,212,.12)}button{border:0;background:#193940;color:#fff;cursor:pointer;transition:transform .2s,filter .2s}button:hover{transform:translateY(-1px);filter:brightness(1.08)}.error{min-height:19px;margin:13px 0 0;color:#b13e3e;font-size:12px}</style></head><body><main class="box"><div class="brand">JIYU<span>GEBIT</span></div><small>LOCAL CONTENT STUDIO</small><h1>内容管理登录</h1><form id="login"><input name="user" placeholder="用户名" required autofocus><input name="password" type="password" placeholder="密码" required><button>登录</button></form><p class="error" id="error"></p></main><script>document.querySelector('#login').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target);if(d.get('user')==='gebit'&&d.get('password')==='Aind1350@'){sessionStorage.setItem('jiyuAdmin','1');location.href='manage.html'}else document.querySelector('#error').textContent='用户名或密码不正确。'}</script></body></html>
